<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portofolio Roblox Studio</title>
<style>
:root{--bg:#05080f;--bg2:#0a1428;--card:#0e1d3a;--blue:#2f7bff;--blue2:#7fb2ff;--text:#e8f0ff;--mute:#8fa3c7}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif}
h1,h2,h3{font-weight:700;letter-spacing:.3px}
#track{display:flex;height:100%;width:600vw;transition:transform .9s cubic-bezier(.77,0,.18,1)}
.slide{width:100vw;height:100%;overflow-y:auto;padding:48px 8vw 110px;background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%);opacity:.25;transform:scale(.94);transition:opacity .9s,transform .9s}
.slide.active{opacity:1;transform:none}
.slide.active .rv{animation:up .7s both;animation-delay:calc(var(--i)*.09s + .25s)}
@keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
h2{font-size:clamp(26px,4vw,40px);margin-bottom:6px}
.sub{color:var(--mute);margin-bottom:26px;font-style:italic}
h3{font-size:19px;margin:34px 0 14px;color:var(--blue2)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 8px 24px #0008;transition:transform .35s}
.card:hover{transform:translateY(-5px)}
.card .t{padding:14px}
.card b{display:block;font-size:17px;margin-bottom:4px}
.card small{color:var(--mute)}
.ph{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#12264a}
.ph.missing{opacity:.35}
video{width:100%;aspect-ratio:16/10;background:#000;display:block}
.btn{display:inline-block;margin-top:10px;padding:9px 16px;background:var(--blue);color:#fff;text-decoration:none;border-radius:6px;font-size:14px;transition:background .3s}
.btn:hover{background:#1c5fd6}
.price{background:linear-gradient(135deg,#123a82,#0a1f4a);border-radius:10px;padding:22px;margin-top:30px;box-shadow:0 8px 24px #0008}
.price h3{margin:0 0 6px;color:#fff}
.price p{color:var(--blue2);font-size:clamp(22px,3vw,30px);font-weight:700}
.price span{display:block;color:var(--mute);font-size:14px;margin-top:6px;font-weight:400}
/* slide 1 */
.hero{display:flex;gap:40px;align-items:center;flex-wrap:wrap;min-height:80%}
.hero .pf{width:240px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;box-shadow:0 0 0 6px var(--card),0 14px 40px #000a;background:#12264a}
.hero h1{font-size:clamp(32px,5vw,54px);margin-bottom:8px}
.hero .role{color:var(--blue2);font-size:20px;margin-bottom:18px}
.facts{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.facts div{background:var(--card);padding:10px 16px;border-radius:8px}
.facts small{display:block;color:var(--mute)}
.hero p{max-width:560px;line-height:1.7;color:#c6d4f0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chips span{background:var(--card);color:var(--blue2);padding:6px 12px;border-radius:20px;font-size:14px}
.hint{margin-top:26px;color:var(--mute);font-size:14px}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;padding:14px;background:linear-gradient(transparent,#000d)}
.nav button{background:var(--card);color:var(--text);border:0;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;transition:background .3s}
.nav button:hover{background:var(--blue)}
.dots{display:flex;gap:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:#294a86;cursor:pointer;transition:all .4s}
.dots i.on{background:var(--blue);width:28px;border-radius:6px}
.end{text-align:center;margin-top:40px}
.end h2{font-size:clamp(28px,5vw,46px)}
.end p{max-width:560px;margin:14px auto;color:#c6d4f0;line-height:1.7}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.slide{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.nav{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.socials{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn.alt{background:var(--card)}.btn.alt:hover{background:#18305f}
.btn.big{padding:13px 24px;font-size:16px}
@supports(height:100dvh){html,body,#track,.slide{height:100dvh}}
@media(max-width:900px){.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
 .slide{padding:28px 5vw 110px}
 .hero{justify-content:center;text-align:center;gap:22px}
 .hero .pf{width:170px}
 .facts,.chips{justify-content:center}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}
 .card .t{padding:10px}.card b{font-size:15px}.card small{font-size:13px}
 .btn{padding:8px 12px;font-size:13px}.btn.big{padding:12px 20px;font-size:15px}
 .price{padding:16px}
 .nav{gap:10px}.nav button{width:38px;height:38px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="track"></div>

<div class="nav">
  <button id="prev" aria-label="Sebelumnya">&#8249;</button>
  <div class="dots" id="dots"></div>
  <button id="next" aria-label="Berikutnya">&#8250;</button>
</div>

<script>
/* ======================================================
   EDIT DATA KAMU DI SINI SAJA
   ====================================================== */
const DATA = {
  nama: "Risa Atifah",
  role: "Roblox Developer & Animator 3D VFX Artist",
  umur: "27 Tahun",
  pendidikan: "Sarjana Pendidikan Bahasa Inggris",
  bio: "Sejak awal 2025 saya membuat game di Roblox dan menghasilkan game full system yang ramai dimainkan. Keahlian yang paling menonjol dari saya adalah efek VFX 3D dan animation rigging R6/R15, didukung kemampuan building, landscaping, scripting Lua, dan UI/GUI.",
  kemampuan: ["VFX 3D","Animation Rigging R6/R15","3D Animator","Building & Landscaping","Scripting Lua","UI / GUI"],
  cerita: "Perkenalan saya dengan coding dimulai sejak kelas 6 SD, ketika saya belajar dasar JavaScript secara otodidak lewat Blogspot bersama teman dari luar negeri. Kini dasar itu saya kembangkan di Roblox Studio.",

  // 5 map terkenal: nama, visitor, link Roblox
  mapTerkenal: [
    {nama:"Lembah Lohe",          visitor:"1M+",   link:"https://www.roblox.com/games/139737426461434/LEMBAH-LOHE"},
    {nama:"Bulu Saraung",         visitor:"500K+", link:"https://www.roblox.com/games/122070909089085/BULU-SARAUNG"},
    {nama:"Sekitar Makassar",     visitor:"",      link:"https://www.roblox.com/games/72890444139297/Around-Makassar"},
    {nama:"Bantimurung Kawasan",  visitor:"",      link:"https://www.roblox.com/games/95364282684452/KAWASAN-WISATA-BANTIMURUNG"},
    {nama:"Cloud Country",        visitor:"",      link:"https://www.roblox.com/games/126941616492374/NEGERI-AWAN"}
  ],

  // 5 system (nama file foto: foto/system-1 ... system-5)
  system: [
    {nama:"System Ojol",                 desk:"Order, antar penumpang, tarif & rating driver."},
    {nama:"System Fishing",              desk:"Memancing, rarity ikan, jual & inventory."},
    {nama:"System Tangkap Hewan",        desk:"Tangkap kupu-kupu, babi, dan orang utan."},
    {nama:"System Tambang",              desk:"Mining, ore, upgrade alat, dan jual hasil."},
    {nama:"System Hangout / Mount Kit",  desk:"Duduk, emote, mount, dan interaksi pemain."},
    {nama:"Perbaikan UI / GUI",          desk:"Rapikan tampilan GUI yang berantakan, responsif untuk HP dan PC."},
    {nama:"Sprite Sheet Animation GUI",  desk:"Ubah gambar/sprite sheet menjadi animasi frame GUI yang bergerak."}
  ],

  les: [
    {nama:"Dasar Roblox Studio",  desk:"Interface, building, dan membuat map pertama."},
    {nama:"Scripting Lua",        desk:"Dari dasar hingga membuat system sendiri."},
    {nama:"UI/GUI & Animasi",     desk:"Desain GUI, animasi, dan rigging dasar."}
  ],
  lesInfo: "Menerima les offline di sekitar Kota Makassar maupun di luar Makassar, serta online lewat Discord/Zoom. Materi dan jadwal disesuaikan dengan kemampuan murid. Hubungi saya untuk biaya dan jadwal.",
  kolab: ["Oziw Terla", "Neko Omen", "Dev terkenal lainnya"],
  sosmed: [
    {nama:"Join Discord", link:"https://discord.gg/aFtjnG9vc", utama:true},
    {nama:"Facebook",  link:"https://www.facebook.com/risa.saripa.7"},
    {nama:"Instagram", link:"https://www.instagram.com/risaatifah/"},
    {nama:"TikTok",    link:""}
  ],
};

/* ======================================================
   AUTO-DETEKSI FILE: png / jpg / jpeg / webp (huruf besar-kecil)
   ====================================================== */
const EXTS = ["png","jpg","jpeg","webp","PNG","JPG","JPEG","WEBP"];
function paths(base, folder, exts){
  const name = base.replace(new RegExp("^"+folder+"/"), "");
  const out = [];
  [folder+"/", folder, ""].forEach(p=>exts.forEach(e=>out.push(`${p}${name}.${e}`)));
  return out;
}
function img(base, alt, cls="ph", removeIfMissing=false){
  const list = paths(base, "foto", EXTS);
  const i = document.createElement("img");
  i.className = cls; i.alt = alt; i.loading = "lazy";
  let n = 0;
  i.onerror = () => {
    n++;
    if(n < list.length){ i.src = list[n]; }
    else if(removeIfMissing){ (i.closest(".card")||i).remove(); }
    else{ i.classList.add("missing"); i.onerror = null; }
  };
  i.src = list[0];
  return i;
}
function video(base){
  const v = document.createElement("video");
  v.controls = true; v.preload = "metadata"; v.muted = true; v.playsInline = true;
  paths(base, "video", ["mp4","webm","mov"]).forEach(u=>{
    const s = document.createElement("source");
    const e = u.split(".").pop();
    s.src = u; s.type = e==="mov" ? "video/quicktime" : `video/${e}`;
    v.appendChild(s);
  });
  return v;
}
function card(media, title, small, extra=""){
  const c = document.createElement("div");
  c.className = "card rv";
  c.appendChild(media);
  const t = document.createElement("div");
  t.className = "t";
  t.innerHTML = `<b>${title}</b>${small?`<small>${small}</small>`:""}${extra}`;
  c.appendChild(t);
  return c;
}
function priceBox(title, range, note){
  const p = document.createElement("div");
  p.className = "price rv";
  p.innerHTML = `<h3>${title}</h3><p>${range}</p><span>${note}</span>`;
  return p;
}
function head(h, s){
  const f = document.createDocumentFragment();
  const a = document.createElement("h2"); a.className="rv"; a.textContent = h;
  const b = document.createElement("div"); b.className="sub rv"; b.textContent = s;
  f.append(a,b); return f;
}
function sec(t){ const h=document.createElement("h3"); h.className="rv"; h.textContent=t; return h; }
function grid(){ const g=document.createElement("div"); g.className="grid"; return g; }

/* ======================================================
   SLIDE
   ====================================================== */
const slides = [];

// 1. Profil
(()=>{
  const s = document.createElement("section");
  s.className = "slide";
  const hero = document.createElement("div"); hero.className = "hero";
  const pf = img("foto/profil", "Foto " + DATA.nama, "pf rv");
  const txt = document.createElement("div");
  txt.innerHTML = `
    <h1 class="rv">${DATA.nama}</h1>
    <div class="role rv">${DATA.role}</div>
    <div class="facts rv">
      <div><small>Umur</small>${DATA.umur}</div>
      <div><small>Pendidikan terakhir</small>${DATA.pendidikan}</div>
    </div>
    <p class="rv">${DATA.bio}</p>
    <div class="chips rv">${DATA.kemampuan.map(k=>`<span>${k}</span>`).join("")}</div>
    <p class="rv">${DATA.cerita}</p>
    <div class="hint rv">Geser atau tekan panah untuk melihat portofolio</div>`;
  hero.append(pf, txt); s.appendChild(hero); slides.push(s);
})();

// 2. Map
(()=>{
  const s = document.createElement("section"); s.className = "slide";
  s.appendChild(head("Hasil Game", "Full system dari nol sampai terkenal, plus map underrated yang layak dilirik."));
  s.appendChild(sec("5 Map Terkenal"));
  const g = grid();
  DATA.mapTerkenal.forEach((m,i)=>{
    g.appendChild(card(img(`foto/map-terkenal-${i+1}`, m.nama), m.nama,
      m.visitor ? `Visitor: ${m.visitor}` : "",
      `<a class="btn" href="${m.link}" target="_blank" rel="noopener">Kunjungi di Roblox</a>`));
  });
  s.appendChild(g);
  s.appendChild(sec("Map Underrated (landscaping & system bagus, 0 pengunjung)"));
  const g2 = grid();
  for(let i=1;i<=10;i++){
    g2.appendChild(card(img(`foto/map-underrated-${i}`, `Map underrated ${i}`, "ph", true), `Map Underrated ${i}`, "Tersedia untuk dibeli / dikembangkan"));
  }
  s.appendChild(g2);
  s.appendChild(priceBox("Rate Harga Building Map", "Rp 300.000 - Rp 2.000.000", "Tergantung ukuran, detail landscaping, dan system yang dimasukkan."));
  slides.push(s);
})();

// 3. System
(()=>{
  const s = document.createElement("section"); s.className = "slide";
  s.appendChild(head("System & Scripting", "System, perbaikan UI/GUI, dan animasi frame GUI, siap dipakai di game kamu."));
  const g = grid();
  DATA.system.forEach((x,i)=> g.appendChild(card(img(`foto/system-${i+1}`, x.nama), x.nama, x.desk)));
  s.appendChild(g);
  s.appendChild(priceBox("Rate Harga Custom System", "Rp 50.000 - Rp 500.000", "Berlaku juga untuk perbaikan UI/GUI dan sprite sheet animation GUI. Bisa request sesuai kebutuhan game kamu."));
  slides.push(s);
})();

// 4. 3D & Animasi
(()=>{
  const s = document.createElement("section"); s.className = "slide";
  s.appendChild(head("3D Commission & Animation Rigging", "Standar R6 / R15."));
  s.appendChild(sec("Foto"));
  const g = grid(); g.classList.add("g3");
  for(let i=1;i<=6;i++) g.appendChild(card(img(`foto/3d-${i}`, `3D ${i}`), `3D Hasil ${i}`, ""));
  s.appendChild(g);
  s.appendChild(sec("Video Singkat"));
  const g2 = grid(); g2.classList.add("g2");
  for(let i=1;i<=4;i++) g2.appendChild(card(video(`video/3d-${i}`), `Video ${i}`, "Animasi / rigging"));
  s.appendChild(g2);
  s.appendChild(priceBox("Rate Harga 3D Commission & Animation Rigging", "Rp 5.000 - Rp 200.000", "Tergantung tingkat kerumitan model dan animasi."));
  slides.push(s);
})();

// 5. Les / Kelas Roblox Studio
(()=>{
  const s = document.createElement("section"); s.className = "slide";
  s.appendChild(head("Les Roblox Studio", "Belajar membuat game sendiri, offline maupun online."));
  const g = grid();
  DATA.les.forEach((x,i)=> g.appendChild(card(img(`foto/les-${i+1}`, x.nama), x.nama, x.desk)));
  s.appendChild(g);
  s.appendChild(priceBox("Lokasi & Metode", "Offline & Online", DATA.lesInfo));
  slides.push(s);
})();

// 6. Kolaborasi + penutup
(()=>{
  const s = document.createElement("section"); s.className = "slide";
  s.appendChild(head("Kolaborasi", "Pernah satu project bersama developer terkenal."));
  const g = grid();
  DATA.kolab.forEach((n,i)=> g.appendChild(card(img(`foto/kolab-${i+1}`, n), n, "Satu project bersama")));
  s.appendChild(g);
  const e = document.createElement("div"); e.className = "end rv";
  const so = DATA.sosmed.filter(x=>x.link).map(x=>`<a class="btn ${x.utama?"big":"alt"}" href="${x.link}" target="_blank" rel="noopener">${x.nama}</a>`).join("");
  e.innerHTML = `<h2>Terima kasih sudah berkunjung</h2>
    <p>Siap membuat VFX 3D, animation rigging, map, atau system untuk project kamu. Join channel Discord saya untuk mendapatkan asset gratis buatan saya sendiri dan untuk diskusi commission.</p>
    <div class="socials">${so}</div>`;
  s.appendChild(e);
  slides.push(s);
})();

/* ======================================================
   NAVIGASI
   ====================================================== */
const track = document.getElementById("track");
const dots = document.getElementById("dots");
slides.forEach((s,i)=>{
  track.appendChild(s);
  const d = document.createElement("i"); d.onclick = ()=>go(i); dots.appendChild(d);
});
let cur = 0;
function go(n){
  cur = Math.max(0, Math.min(slides.length-1, n));
  track.style.transform = `translateX(-${cur*100}vw)`;
  slides.forEach((s,i)=>{
    s.classList.remove("active");
    if(i===cur){
      s.scrollTop = 0;
      s.querySelectorAll(".rv").forEach((el,k)=>el.style.setProperty("--i", Math.min(k,14)));
      void s.offsetWidth; s.classList.add("active");
    }
  });
  [...dots.children].forEach((d,i)=>d.classList.toggle("on", i===cur));
}
document.getElementById("prev").onclick = ()=>go(cur-1);
document.getElementById("next").onclick = ()=>go(cur+1);
addEventListener("keydown", e=>{
  if(e.key==="ArrowRight") go(cur+1);
  if(e.key==="ArrowLeft") go(cur-1);
});
let sx=0, sy=0;
addEventListener("touchstart", e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY;},{passive:true});
addEventListener("touchend", e=>{
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(cur + (dx<0?1:-1));
});
go(0);
</script>
</body>
</html>
